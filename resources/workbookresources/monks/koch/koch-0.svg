<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -100 310 130" width="465" height="195" role="img" aria-label="Koch-Kurve der Rekursionstiefe 0 / Koch curve of recursion depth 0">
  <rect x="-20" y="-100" width="310" height="130" rx="8" fill="#ffffff"/>
  <!-- marks at both ends -->
  <g stroke="#7a7a7a" stroke-width="1.5">
    <line x1="0" y1="-5" x2="0" y2="5"/>
    <line x1="270" y1="-5" x2="270" y2="5"/>
  </g>
  <!-- the single segment of depth 0 -->
  <line x1="0" y1="0" x2="270" y2="0" stroke="#1f5fbf" stroke-width="2.5" stroke-linecap="round"/>
  <g font-family="sans-serif" font-size="12" fill="#444444" text-anchor="middle" dominant-baseline="middle">
    <text x="135" y="16">270</text>
  </g>
</svg>
