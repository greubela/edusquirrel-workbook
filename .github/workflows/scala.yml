name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Build Scala.js (buildClientFast)
        run: sbt -batch -v buildClientFast

      - name: Assemble GitHub Pages site
        run: |
          set -e
          rm -rf _site
          mkdir -p _site

          # 1) Copy the static homepage tree (index.html + per-page subdirs).
          cp -R homepage/. _site/

          # 2) Copy the Scala.js bundle to the canonical /js/app/ location
          #    that the HTML pages and feedback-demo-loader.js expect.
          # buildClientFast writes the linked JS to artifacts/newest/client.js
          mkdir -p _site/js/app
          BUNDLE_FILE="artifacts/newest/client.js"
          if [ ! -f "$BUNDLE_FILE" ]; then
            echo "Could not find buildClientFast output at $BUNDLE_FILE" >&2
            exit 1
          fi
          cp "$BUNDLE_FILE" _site/js/app/main.js

          # 3) Copy resources (images, PDFs, programs).
          if [ -d resources ]; then
            cp -R resources _site/resources
          fi

          # 4) Fix relative paths: homepage files use ../resources/ (correct
          #    locally), but on GitHub Pages resources/ is a sibling of the
          #    HTML root, not a parent dir. One sed pass handles both depths:
          #      ../resources/   -> resources/   (files at _site root)
          #      ../../resources/ -> ../resources/ (files one level deep)
          find _site -name "*.html" -exec sed -i 's|../resources/|resources/|g' {} +

          # 5) Optional favicon at the root.
          if [ -f favicon.ico ]; then
            cp favicon.ico _site/favicon.ico
          fi

          echo "::group::_site root"
          ls -la _site
          echo "::endgroup::"
          echo "::group::_site/js/app"
          ls -la _site/js/app | head -n 30
          echo "::endgroup::"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
