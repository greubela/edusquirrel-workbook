name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'sbt'

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Scala.js client and worker
        run: sbt -batch -v buildClientFast buildWorkerFast

      - name: Assemble GitHub Pages site
        run: node tools/dev/assemble-site.mjs

      - name: Verify Pages artifact
        run: |
          set -euo pipefail

          test -f _site/index.html
          test -f _site/js/app/main.js
          test -d _site/resources
          test -d _site/resources/img
          test -d _site/img
          test -f _site/artifacts/newest/client.js
          test -f _site/artifacts/newest/backend-worker.js

          ASSET_COUNT="$(find _site -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.gif' -o -iname '*.svg' \) | wc -l)"
          if [ "$ASSET_COUNT" -lt 1 ]; then
            echo "No image assets were copied into _site." >&2
            exit 1
          fi

          echo "::group::_site root"
          ls -la _site
          echo "::endgroup::"
          echo "::group::_site/js/app"
          ls -la _site/js/app | head -n 30
          echo "::endgroup::"
          echo "::group::_site/artifacts/newest"
          ls -la _site/artifacts/newest | head -n 30
          echo "::endgroup::"
          echo "Image assets copied: $ASSET_COUNT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
