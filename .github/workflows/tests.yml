name: Tests

on:
  pull_request:
  workflow_call:
    inputs:
      build-pages:
        description: Build the Pages artifact alongside browser checks
        type: boolean
        default: false
    outputs:
      pages_artifact_name:
        description: Pages artifact produced by the release build
        value: ${{ jobs.pages-build.outputs.pages_artifact_name }}
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with project/repositories; the mirror is tried before Maven Central.
  COURSIER_REPOSITORIES: https://maven-central.storage-download.googleapis.com/maven2|https://repo.maven.apache.org/maven2
  SBT_OPTS: >-
    -Dsbt.override.build.repos=true
    -Dsbt.repository.config=${{ github.workspace }}/project/repositories

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: edusquirrel_account_test
          MYSQL_USER: account_test
          # Disposable credentials unique to this run; no repository secrets needed.
          MYSQL_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      SQL_HOST: 127.0.0.1
      SQL_DATABASE: edusquirrel_account_test
      SQL_USER: account_test
      SQL_PW: ${{ github.run_id }}-${{ github.run_attempt }}
      SERVER_SECRET: disposable-account-tests-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
          # Only scala-js resolves every module, so only it saves the dependency cache.
          cache-read-only: true
          cache-dependency-path: |
            build.sbt
            project/*.scala
            project/*.sbt
            project/build.properties
            project/repositories
      - uses: sbt/setup-sbt@v1
      - name: Restore incremental JVM build
        uses: actions/cache/restore@v5
        with:
          path: |
            target/coreJVM
            target/server
            target/root
            target/streams
            project/target
          key: ${{ runner.os }}-scala-jvm-build-${{ hashFiles('build.sbt', 'project/*.scala', 'project/*.sbt', 'project/build.properties', 'project/repositories') }}-${{ github.sha }}
          # The last fallback survives build-definition changes; Zinc recompiles what they invalidate.
          restore-keys: |
            ${{ runner.os }}-scala-jvm-build-${{ hashFiles('build.sbt', 'project/*.scala', 'project/*.sbt', 'project/build.properties', 'project/repositories') }}-
            ${{ runner.os }}-scala-jvm-build-
      - name: Test accounts and both typed history layouts against MySQL
        env:
          SQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: sbt -batch -J-Xmx4G -Dsbt.supershell=false 'server / MysqlIntegration / test'
      - name: Verify standalone startup against a valid database
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Build and start the standalone server against MySQL
        env:
          SQL_PORT: ${{ job.services.mysql.ports['3306'] }}
        run: |
          sbt -batch -J-Xmx4G -Dsbt.supershell=false buildServerDev
          node tools/dev/check-server-assembly.mjs

  # Node checks need no Scala build, so they report within a minute.
  static-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:static

  # The JVM and Scala.js halves of the cross-built core compile on separate
  # runners, so neither waits for the other or shares its heap.
  scala-jvm:
    runs-on: ubuntu-latest
    # Allow a clean build cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
          # Only scala-js resolves every module, so only it saves the dependency cache.
          cache-read-only: true
          cache-dependency-path: |
            build.sbt
            project/*.scala
            project/*.sbt
            project/build.properties
            project/repositories
      - uses: sbt/setup-sbt@v1
      - name: Restore incremental JVM build
        uses: actions/cache@v5
        with:
          path: |
            target/coreJVM
            target/server
            target/root
            target/streams
            project/target
          key: ${{ runner.os }}-scala-jvm-build-${{ hashFiles('build.sbt', 'project/*.scala', 'project/*.sbt', 'project/build.properties', 'project/repositories') }}-${{ github.sha }}
          # The last fallback survives build-definition changes; Zinc recompiles what they invalidate.
          restore-keys: |
            ${{ runner.os }}-scala-jvm-build-${{ hashFiles('build.sbt', 'project/*.scala', 'project/*.sbt', 'project/build.properties', 'project/repositories') }}-
            ${{ runner.os }}-scala-jvm-build-
      - name: Test the JVM modules
        run: sbt -batch -J-Xmx4G -Dsbt.supershell=false 'all coreJVM/test server/test'

  scala-js:
    runs-on: ubuntu-latest
    # Allow a clean dependency/build cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
          cache-dependency-path: |
            build.sbt
            project/*.scala
            project/*.sbt
            project/build.properties
            project/repositories
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Restore incremental Scala.js build
        uses: actions/cache@v5
        with:
          path: |
            target/coreJS
            target/client
            target/worker
            target/root
            target/streams
            project/target
          key: ${{ runner.os }}-scala-js-build-${{ hashFiles('build.sbt', 'project/*.scala', 'project/*.sbt', 'project/build.properties', 'project/repositories') }}-${{ github.sha }}
          # The last fallback survives build-definition changes; Zinc recompiles what they invalidate.
          restore-keys: |
            ${{ runner.os }}-scala-js-build-${{ hashFiles('build.sbt', 'project/*.scala', 'project/*.sbt', 'project/build.properties', 'project/repositories') }}-
            ${{ runner.os }}-scala-js-build-
      # Scala.js DOM suites require jsdom while constructing their fixtures.
      - name: Install Node test dependencies
        run: npm ci
      # The JVM-only updates complete the dependency cache this job saves.
      - name: Test the Scala.js modules
        run: sbt -batch -J-Xmx4G -Dsbt.supershell=false 'all coreJS/test client/test worker/test' coreJVM/update server/update

  # Builds the bundles for the browser checks alongside scala-js, so those checks
  # need not wait for every Scala test. scala-js alone saves the Scala.js build cache.
  browser-bundles:
    runs-on: ubuntu-latest
    outputs:
      browser_artifact_name: browser-bundles-${{ github.run_attempt }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
          cache-read-only: true
          cache-dependency-path: |
            build.sbt
            project/*.scala
            project/*.sbt
            project/build.properties
            project/repositories
      - uses: sbt/setup-sbt@v1
      - name: Restore incremental Scala.js build
        uses: actions/cache/restore@v5
        with:
          path: |
            target/coreJS
            target/client
            target/worker
            target/root
            target/streams
            project/target
          key: ${{ runner.os }}-scala-js-build-${{ hashFiles('build.sbt', 'project/*.scala', 'project/*.sbt', 'project/build.properties', 'project/repositories') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-scala-js-build-${{ hashFiles('build.sbt', 'project/*.scala', 'project/*.sbt', 'project/build.properties', 'project/repositories') }}-
            ${{ runner.os }}-scala-js-build-
      - name: Build browser artifacts
        run: sbt -batch -J-Xmx4G -Dsbt.supershell=false buildClientDev buildWorkerDev
      - name: Upload browser bundles
        uses: actions/upload-artifact@v7
        with:
          name: browser-bundles-${{ github.run_attempt }}
          path: |
            artifacts/newest/client.js
            artifacts/newest/worker.js
          if-no-files-found: error
          retention-days: 1

  browser-tests:
    needs: browser-bundles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Download tested browser bundles
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.browser-bundles.outputs.browser_artifact_name }}
          path: artifacts/newest
      - run: npx playwright install --with-deps chromium
      - name: Allow Chromium's sandbox on Ubuntu
        shell: bash
        run: |
          chromium_path="$(node --input-type=module -e 'import {chromium} from "playwright"; process.stdout.write(chromium.executablePath())')"
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            # Permit user namespaces only for this browser; keep host restrictions enabled.
            sudo tee /etc/apparmor.d/edusquirrel-playwright > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile edusquirrel-playwright "$chromium_path" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/edusquirrel-playwright
          fi
      - run: npm run test:workbooks

  pages-build:
    if: ${{ inputs.build-pages }}
    needs: scala-js
    runs-on: ubuntu-latest
    # A deploy-only retry must retain the artifact name from its producing build.
    outputs:
      pages_artifact_name: github-pages-${{ github.run_attempt }}
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: 'sbt'
          cache-read-only: true
          cache-dependency-path: |
            build.sbt
            project/*.scala
            project/*.sbt
            project/build.properties
            project/repositories

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The Scala.js job already compiled this revision and saved its Zinc output.
      # Restore it before release linking instead of compiling all sources again.
      - name: Restore tested Scala.js build
        uses: actions/cache/restore@v5
        with:
          path: |
            target/coreJS
            target/client
            target/worker
            target/root
            target/streams
            project/target
          key: ${{ runner.os }}-scala-js-build-${{ hashFiles('build.sbt', 'project/*.scala', 'project/*.sbt', 'project/build.properties', 'project/repositories') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-scala-js-build-${{ hashFiles('build.sbt', 'project/*.scala', 'project/*.sbt', 'project/build.properties', 'project/repositories') }}-
            ${{ runner.os }}-scala-js-build-

      - name: Test Pages export
        run: node --test tools/dev/assemble-pages.test.mjs

      - name: Build client and worker
        run: sbt -batch -J-Xmx4G -Dsbt.supershell=false buildClientDeploy buildWorkerDeploy

      - name: Build MathWorld
        working-directory: resources/programs/20260907MathworldMain
        run: |
          npm ci
          npm run build -- --base=./

      - name: Assemble GitHub Pages site
        run: node tools/dev/assemble-pages.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

  # Preserve the required "tests" status as the gate for the whole test suite.
  tests:
    if: ${{ always() }}
    needs: [static-tests, scala-jvm, scala-js, browser-bundles, browser-tests, mysql-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job to pass
        env:
          STATIC_RESULT: ${{ needs.static-tests.result }}
          SCALA_JVM_RESULT: ${{ needs.scala-jvm.result }}
          SCALA_JS_RESULT: ${{ needs.scala-js.result }}
          BUNDLES_RESULT: ${{ needs.browser-bundles.result }}
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
          MYSQL_RESULT: ${{ needs.mysql-integration.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$SCALA_JVM_RESULT" = success
          test "$SCALA_JS_RESULT" = success
          test "$BUNDLES_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$MYSQL_RESULT" = success
