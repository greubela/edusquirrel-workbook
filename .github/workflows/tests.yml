name: Tests

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    # A clean cross-platform Scala build plus serial browser checks can exceed 30 minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # Scala.js DOM suites require jsdom while constructing their fixtures.
      - name: Install Node test dependencies
        run: npm ci
      - name: Test every Scala module and build browser artifacts
        run: sbt -batch -J-Xmx4G -Dsbt.supershell=false coreJVM/test coreJS/test client/test server/test worker/test desktop/compile buildClientDev buildWorkerDev buildServerDev
      - name: Verify standalone server assembly
        run: node tools/dev/check-server-assembly.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:static
      - run: npm run test:workbooks
