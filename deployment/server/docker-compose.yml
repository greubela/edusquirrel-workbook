services:
  proxy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - /srv/edusquirrel/caddy/data:/data
      - /srv/edusquirrel/caddy/config:/config
    depends_on:
      edusquirrel:
        condition: service_started

  edusquirrel:
    image: eclipse-temurin:21-jre-alpine
    restart: unless-stopped
    working_dir: /app
    command: [
      "java", 
      "-Dplay.http.forwarded.version=x-forwarded",
      "-Dplay.http.trustedProxies.0=127.0.0.1",
      "-Dplay.http.trustedProxies.1=::1",
      "-Dplay.http.trustedProxies.2=172.16.0.0/12",
      "-Dplay.http.trustedProxies.3=192.168.0.0/16",
      "-Dplay.http.trustedProxies.4=10.0.0.0/8",
      "-jar", 
      "/app/server.jar"
    ]
    env_file:
      - .env
    volumes:
      - type: bind
        source: /home/andre/javaserver/artifacts/newest/server.jar
        target: /app/server.jar
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "9000"
    environment:
      TZ: Europe/Berlin
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

configs:
  caddyfile:
    content: |
      ypcgzj23.trafficplex.cloud {
          # 1. Handle browser preflight checks immediately
          @preflight method OPTIONS
          handle @preflight {
              header Access-Control-Allow-Origin "{header.Origin}"
              header Access-Control-Allow-Credentials "true"
              header Access-Control-Allow-Methods "GET, POST, OPTIONS"
              header Access-Control-Allow-Headers "Content-Type, Authorization"
              header Vary "Origin"
              respond "" 204
          }
          header Access-Control-Allow-Origin "{header.Origin}" {
              defer
          }
          header Access-Control-Allow-Credentials "true" {
              defer
          }
          header Access-Control-Allow-Methods "GET, POST, OPTIONS" {
              defer
          }
          header Access-Control-Allow-Headers "Content-Type, Authorization" {
              defer
          }
          header Vary "Origin" {
              defer
          }

          reverse_proxy edusquirrel:9000 {
              header_up X-Real-IP {remote_host}
          }
      }
