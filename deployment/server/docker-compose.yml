services:
  proxy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - /srv/edusquirrel/caddy/data:/data
      - /srv/edusquirrel/caddy/config:/config
    depends_on:
      edusquirrel:
        condition: service_started

  edusquirrel:
    image: eclipse-temurin:21-jre-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["java", "-jar", "/app/server.jar"]
    env_file:
      - .env
    volumes:
      - /home/andre/javaserver/artifacts/newest/server.jar:/app/server.jar:ro
    expose:
      - "9000"
    environment:
      TZ: Europe/Berlin
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

configs:
  caddyfile:
    content: |
      ypcgzj23.trafficplex.cloud {
          @preflight method OPTIONS
          handle @preflight {
              header Access-Control-Allow-Origin "https://andregreubel.ddns.net" "https://evadid.it/"
              header Access-Control-Allow-Methods "GET, POST, OPTIONS"
              header Access-Control-Allow-Headers "Content-Type, Authorization"
              header Vary "Origin"
              respond "" 204
          }

          header {
              Access-Control-Allow-Origin "https://andregreubel.ddns.net" "https://evadid.it/"
              Access-Control-Allow-Methods "GET, POST, OPTIONS"
              Access-Control-Allow-Headers "Content-Type, Authorization"
              Vary "Origin"
          }

          reverse_proxy edusquirrel:9000
      }