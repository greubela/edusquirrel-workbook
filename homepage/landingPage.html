              <script>
                const sponsorRow = document.getElementById('sponsorRow');
                const sponsorText = document.getElementById('sponsorText');
                const sponsorToggle = document.getElementById('sponsorToggle');

                sponsorToggle.addEventListener('click', () => {
                  const toggled = sponsorRow.classList.toggle('toggled');
                  sponsorText.textContent = toggled
