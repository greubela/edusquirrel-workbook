<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workbook Landing Page</title>
    <link rel="stylesheet" href="cssDts/landingpage.css" />
  </head>
  <body>
    <main class="landing-container">
      <section class="sponsor-row" id="sponsorRow">
        <span id="sponsorText">sponsored by nobody :-(</span>
        <button id="sponsorToggle" aria-pressed="false" aria-label="Toggle sponsor message">
          Toggle
        </button>
      </section>

      <section class="section-heading">
        <h1>Workbooks (Finished)</h1>
      </section>

      <section class="workbook-grid">
        <figure class="workbook-card">
          <a
            href="https://tanghoang.github.io/arbeitsheft-digital-scratch/chapter/einleitung"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              src="https://tanghoang.github.io/arbeitsheft-digital-scratch/assets/moving_rohr-B41RzHuV.gif"
              alt="Finished workbook option 1"
            />
          </a>
          <figcaption>Interactive Scratch workbook (German introduction).</figcaption>
        </figure>
        <figure class="workbook-card">
          <a href="../resources/programs/20251113maxPrimm/index.htm" target="_blank" rel="noopener noreferrer">
            <img src="../resources/programs/20251113maxPrimm/img/caesar-chatgpt.jpg" alt="Finished workbook option 2" />
          </a>
          <figcaption>Caesar cipher workbook prototype by Max Primm.</figcaption>
        </figure>
      </section>

      <section class="section-heading">
        <h1>Workbooks (Prototypes)</h1>
      </section>

      <section class="workbook-grid">
        <figure class="workbook-card">
          <a href="https://evadid.it/dtsprototype/workbookMain.html" target="_blank" rel="noopener noreferrer">
            <img src="../resources/img/art/marie/monkworkbook/penup_20250907_110745.jpg" alt="Prototype workbook option 1" />
          </a>
          <figcaption>Digital transformation school (DTS) concept workbook.</figcaption>
        </figure>
        <figure class="workbook-card">
          <a href="./workbookDesign.html" target="_blank" rel="noopener noreferrer">
            <img src="../resources/img/art/mockup/BlockEditor.png" alt="Prototype workbook option 2" />
          </a>
          <figcaption>Workbook design mock-up featuring the block editor.</figcaption>
        </figure>
      </section>

      <section class="section-heading">
        <h1>Workbooks (PDF)</h1>
      </section>

      <section class="workbook-grid">
        <figure class="workbook-card">
          <a
            href="https://bildungsserver.berlin-brandenburg.de/fileadmin/bbb/unterricht/rahmenlehrplaene/gymnasiale_oberstufe/curricula/2022/Teil_C_RLP_GOST_2022_Informatik.pdf"
            download="workbook-pdf-1.pdf"
          >
            <img src="https://via.placeholder.com/220x160?text=PDF+Workbook+1" alt="Placeholder PDF workbook 1" />
          </a>
          <figcaption>Placeholder PDF workbook download number one.</figcaption>
        </figure>
        <figure class="workbook-card">
          <a
            href="https://bildungsserver.berlin-brandenburg.de/fileadmin/bbb/unterricht/rahmenlehrplaene/gymnasiale_oberstufe/curricula/2022/Teil_C_RLP_GOST_2022_Informatik.pdf"
            download="workbook-pdf-2.pdf"
          >
            <img src="https://via.placeholder.com/200x200?text=PDF+Workbook+2" alt="Placeholder PDF workbook 2" />
          </a>
          <figcaption>Placeholder PDF workbook download number two.</figcaption>
        </figure>
        <figure class="workbook-card">
          <a
            href="https://bildungsserver.berlin-brandenburg.de/fileadmin/bbb/unterricht/rahmenlehrplaene/gymnasiale_oberstufe/curricula/2022/Teil_C_RLP_GOST_2022_Informatik.pdf"
            download="workbook-pdf-3.pdf"
          >
            <img src="https://via.placeholder.com/240x150?text=PDF+Workbook+3" alt="Placeholder PDF workbook 3" />
          </a>
          <figcaption>Placeholder PDF workbook download number three.</figcaption>
        </figure>
      </section>
    </main>

    <script>
      const sponsorRow = document.getElementById('sponsorRow');
      const sponsorText = document.getElementById('sponsorText');
      const sponsorToggle = document.getElementById('sponsorToggle');

      sponsorToggle.addEventListener('click', () => {
        const toggled = sponsorRow.classList.toggle('toggled');
        sponsorText.textContent = toggled
          ? '... until now :-)'
          : 'sponsored by nobody :-(';
        sponsorToggle.setAttribute('aria-pressed', toggled.toString());
      });
    </script>
  </body>
</html>
